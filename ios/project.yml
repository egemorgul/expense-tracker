name: ExpenseTracker
options:
  bundleIdPrefix: com.egemorgul
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: BWG6459X3M
targets:
  ExpenseTracker:
    type: application
    platform: iOS
    sources: [ExpenseTracker]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Expenses
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  ExpenseTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ExpenseTrackerTests]
    dependencies:
      - target: ExpenseTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
  ExpenseTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ExpenseTrackerUITests]
    dependencies:
      - target: ExpenseTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  ExpenseTracker:
    build:
      targets:
        ExpenseTracker: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [ExpenseTrackerTests, ExpenseTrackerUITests]
      commandLineArguments:
        "-uiTesting": true
